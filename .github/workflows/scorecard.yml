name: OpenSSF Scorecard

# Automated security posture scoring against the OpenSSF Scorecard ruleset:
#   https://github.com/ossf/scorecard
#
# Score appears in the Security tab + can be embedded as a badge.
# Catches regressions in: dangerous workflows, missing branch protection,
# unpinned actions, weak deps, exposed secrets, missing license, etc.
#
# Triggers:
#   - branch_protection_rule (fires when branch protection config changes)
#   - Weekly Saturday cron (keeps the score fresh as new checks ship)
#   - Push to main (catches just-shipped regressions)

on:
  branch_protection_rule:
  schedule:
    - cron: "0 13 * * 6"
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history needed by Scorecard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2
        continue-on-error: true  # tolerate transient external failures (GitHub code-search 429, Sigstore/Fulcio/TUF signing) — not a repo posture issue
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: false avoids the public Sigstore transparency-log
          # signing step, which is the source of upstream TUF/Fulcio failures.
          publish_results: false

      - name: Check SARIF validity
        id: sarif_check
        if: always()
        run: |
          if [ -f results.sarif ] && python3 -c "import json; json.load(open('results.sarif'))" 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice::results.sarif missing or invalid (likely Scorecard was interrupted by an external rate limit) — skipping SARIF upload this run, not a code defect."
          fi

      - name: Upload SARIF (so Security tab shows findings)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3
        if: steps.sarif_check.outputs.valid == 'true'
        with:
          sarif_file: results.sarif

      - name: Upload artifact (raw JSON downloadable from the run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 30
